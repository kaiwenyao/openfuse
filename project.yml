name: OpenFuseMobile
options:
  bundleIdPrefix: com.openfuse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  OpenFuse:
    path: .
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    revision: d9194243bdc68b87d8989376ab52aee7da6c8e0b
targets:
  OpenFuseMobile:
    type: application
    platform: iOS
    sources:
      - path: Platforms/Mobile
      - path: Platforms/Mobile/Resources/Fonts
        buildPhase: resources
      - path: Fixtures/mobile
        buildPhase: resources
    dependencies:
      - package: OpenFuse
        product: OpenFuseData
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.openfuse.mobile
        PRODUCT_NAME: OpenFuse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenFuse
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3935D392G91
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  OpenFuseTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: Platforms/TV
      - path: Platforms/Mobile/MobileLibraryModel.swift
      - path: Fixtures/mobile
        buildPhase: resources
    dependencies:
      - package: OpenFuse
        product: OpenFuseData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openfuse.tv
        PRODUCT_NAME: OpenFuse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenFuse
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
  OpenFuseVision:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: Platforms/Vision
      - path: Platforms/Mobile/MobileLibraryModel.swift
      - path: Fixtures/mobile
        buildPhase: resources
    dependencies:
      - package: OpenFuse
        product: OpenFuseData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openfuse.vision
        PRODUCT_NAME: OpenFuse
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Platforms/Vision/Info.plist
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
schemes:
  OpenFuseTV:
    build:
      targets:
        OpenFuseTV: all
  OpenFuseVision:
    build:
      targets:
        OpenFuseVision: all
  OpenFuseMobile:
    build:
      targets:
        OpenFuseMobile: all
    run:
      config: Debug
